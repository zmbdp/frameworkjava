captcha:
  # 验证码类型，1: 纯数字; 2: 大小写字母+数字; 3: 大小写字母+数字+特殊字符
  type: 3
  # 是否发送随机验证码
  send-message: true
  # 验证码有效期
  code-expiration: 5
  # 单个手机号，每日发送短信次数的限制
  send-limit: 50

sms:
  # 是否开启短信发送功能
  send-message: false
  # 短信签名
  sign-name: FrameWork-Java
  aliyun:
    # 你的 accessKeyId
    accessKeyId: # 你的 accessKeyId
    # 你的 accessKeySecret
    accessKeySecret: # 你的 accessKeySecret
    # 服务器地址
    endpoint: dysmsapi.aliyuncs.com
    # 短信模板 ID
    templateCode: # 你的短信模板 ID

mail:
  # 是否开启邮箱发送功能
  send-message: false
  code:
    # 邮件标题列表（发送时会随机选择一个）
    subject:
      - "【FrameworkJava】验证码通知"
      - "【FrameworkJava】安全验证码提醒"
      - "【FrameworkJava】登录验证码"
      - "【FrameworkJava】系统安全验证"
      - "【FrameworkJava】账户操作验证"
      - "【FrameworkJava】登录安全验证码"
      - "【FrameworkJava】验证码邮件"
      - "【FrameworkJava】验证码通知"
    # 邮件内容模板列表（发送时会随机选择一个，支持 {code} 占位符和 HTML 格式）
    content:
      - "<p>您好，</p><p>您的验证码是：<b>{code}</b>，请在5分钟内使用，勿泄露给他人。</p><p>感谢使用 FrameworkJava。</p>"
      - "<p>尊敬的用户：</p><p>您的验证码为：<span style='color:red; font-weight:bold;'>{code}</span>，有效期5分钟，请妥善保管。</p>"
      - "<p>您正在进行安全验证操作，验证码：<b>{code}</b>，请勿向他人透露。</p>"
      - "<h3>FrameworkJava 安全提示</h3><p>本次登录验证码为：<b>{code}</b>，5分钟内有效。</p>"
      - "<p>亲爱的用户：</p><p>验证码 <b>{code}</b> 已发送至您的邮箱，用于登录或操作确认，请在5分钟内使用。</p>"
      - "<p>【FrameworkJava】账户安全验证</p><p>验证码：<b>{code}</b></p>"
      - "<p>您好，</p><p>本次登录验证码：<b>{code}</b>，请在5分钟内完成验证。</p>"
      - "<p>您正在执行敏感操作，验证码为：<b>{code}</b>，5分钟内有效，请勿泄露。</p>"